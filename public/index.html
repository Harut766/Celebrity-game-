<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Celebrity Game</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stage">
  <video id="idleVideo" class="layer" muted loop playsinline hidden></video>
  <img id="charImage" class="layer" alt="" hidden>
  <div id="charSvg" class="layer"></div>
  <div id="face"></div>
  <div id="fx" class="layer"></div>
  <video id="punishVideo" class="layer" playsinline hidden></video>

  <div id="legend">
    <div id="legendTitle"></div>
    <ul id="legendList"></ul>
  </div>
  <div id="banner" hidden></div>
  <div id="queue" hidden></div>
</div>

<div id="testPanel" hidden>
  <div id="status">…</div>
  <div id="testButtons"></div>
  <label>Ник <input id="testUser" value="Тест" size="12"></label>
  <label>Серия ×<input id="testRepeat" type="number" min="1" max="99" value="1"></label>
</div>

<script src="character.js"></script>
<script src="app.js"></script>
</body>
</html>
