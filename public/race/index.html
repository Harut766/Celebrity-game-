<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Гонка Наций</title>
<link rel="stylesheet" href="/race/style.css">
</head>
<body>
<div id="stage">
  <canvas id="game" width="1080" height="1920"></canvas>

  <header id="hud">
    <div id="title"><span id="titleText">ГОНКА НАЦИЙ</span><span id="round"></span></div>
    <div id="timerBox"><div id="timer">3:00</div><div id="final" hidden>ФИНАЛ ×2</div></div>
  </header>
  <div id="say"></div>

  <ul id="prices"></ul>
  <section id="tops">
    <div class="top" id="topRound"><h3>🏆 Топ раунда</h3><ol></ol></div>
    <div class="top" id="topDay"><h3>⭐ Топ дня</h3><ol></ol></div>
  </section>
  <div id="hint"></div>

  <div id="banners"></div>
  <div id="countdown" hidden></div>
  <div id="legend" hidden></div>
  <div id="winner" hidden></div>
</div>
<script src="/dragon/art.js"></script>
<script src="/race/art.js"></script>
<script src="/race/audio.js"></script>
<script src="/race/game.js"></script>
<script src="/race/fx.js"></script>
<script src="/race/drama.js"></script>
</body>
</html>
